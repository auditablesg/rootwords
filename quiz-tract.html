<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Roots Quiz - tract</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #2d1b00 0%, #3d2817 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 700px; width: 100%; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .progress-container { background-color: rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 15px; margin-bottom: 30px; color: white; }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95em; }
        .progress-bar { background-color: rgba(255, 255, 255, 0.3); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #4ade80; transition: width 0.3s ease; }
        .quiz-card { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); padding: 40px; margin-bottom: 30px; }
        .question-number { font-size: 0.9em; color: #fa709a; font-weight: 600; margin-bottom: 10px; }
        .question-text { font-size: 1.3em; font-weight: 600; margin-bottom: 25px; color: #333; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; background: white; font-size: 1em; }
        .option:hover { border-color: #fa709a; background-color: #fff5f7; }
        .option input[type="radio"] { margin-right: 10px; }
        .option.selected { border-color: #fa709a; background-color: #ffebf0; }
        .option.correct { border-color: #4ade80; background-color: #f0fdf4; }
        .option.incorrect { border-color: #ef4444; background-color: #fef2f2; }
        .feedback { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: 500; }
        .feedback.show { display: block; }
        .feedback.correct { background-color: #dcfce7; color: #166534; border-left: 4px solid #4ade80; }
        .feedback.incorrect { background-color: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
        .controls { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        button { padding: 12px 24px; font-size: 1em; border: none; border-radius: 8px; background: white; color: #fa709a; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); background: #f0f0f0; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .button-primary { background: #4ade80; color: white; }
        .button-primary:hover { background: #22c55e; color: white; }
        .results { display: none; background: white; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        .results.show { display: block; }
        .score-display { font-size: 3em; font-weight: 700; color: #fa709a; margin-bottom: 10px; }
        .results-text { font-size: 1.3em; color: #333; margin-bottom: 30px; }
        .results-message { font-size: 1.1em; color: #666; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Root Word Quiz</h1>
            <p>Master the root: tract (pull)</p>
        </div>
        <div class="progress-container">
            <div class="progress-text">
                <span id="progressText">Question 1 of 15</span>
                <span id="scoreText">Score: 0/0</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="quiz-card" id="quizCard">
            <div class="question-number" id="questionNumber">Question 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="results" id="results">
            <div class="score-display" id="finalScore">15/15</div>
            <div class="results-text">Quiz Complete!</div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="button-primary" onclick="restartQuiz()">Restart Quiz</button>
        </div>
        <div class="controls">
            <button onclick="previousQuestion()" id="prevBtn">← Previous</button>
            <button class="button-primary" onclick="nextQuestion()" id="nextBtn">Next →</button>
        </div>
    </div>
    <script>
        const quizData = [
            {question: "What does the root 'tract' mean?", options: ["To shape", "To build", "To pull or drag", "To speak"], correct: 2, explanation: "Tract means to pull or draw something toward or along."},
            {question: "Which word means 'to pull toward oneself or appeal to'?", options: ["Contract", "Extract", "Attract", "Distract"], correct: 2, explanation: "Attract means to pull toward (ad- = towards; tract = pull)."},
            {question: "What does 'contract' mean?", options: ["To pull apart", "To pull together or reduce size", "To stretch out", "To refuse to agree"], correct: 1, explanation: "Contract means to become smaller (con- = together; tract = pull together)."},
            {question: "Which word means 'to pull out or remove'?", options: ["Attract", "Contract", "Extract", "Distract"], correct: 2, explanation: "Extract means to pull out (ex- = out; tract = pull)."},
            {question: "What does 'distract' mean?", options: ["To pull toward", "To pull back", "To pull away attention", "To pull together"], correct: 2, explanation: "Distract means to pull attention away (dis- = away; tract = pull)."},
            {question: "Which word means 'to pull back or withdraw'?", options: ["Attract", "Protract", "Retract", "Extract"], correct: 2, explanation: "Retract means to pull back (re- = back; tract = pull)."},
            {question: "What is 'traction'?", options: ["The act of pulling apart", "The grip or friction needed", "A type of contract", "A refusal to move"], correct: 1, explanation: "Traction is the grip needed to move forward (tract + -ion = act of pulling)."},
            {question: "What does 'subtraction' mean?", options: ["Adding numbers", "Taking away numbers", "Multiplying", "Dividing"], correct: 1, explanation: "Subtraction is taking away (sub- = under/away; tract + -ion)."},
            {question: "Which vehicle is used to pull equipment?", options: ["Attractor", "Contractor", "Tractor", "Extractor"], correct: 2, explanation: "Tractor is a vehicle that pulls (tract + -or = thing that pulls)."},
            {question: "What does 'protract' mean?", options: ["To pull quickly", "To pull partially", "To prolong or extend", "To refuse extension"], correct: 2, explanation: "Protract means to prolong (pro- = forward; tract = pull forward)."},
            {question: "In Chinese, 'tract' is primarily translated as:", options: ["看 (see)", "建 (build)", "拉、拖 (pull, drag)", "说 (speak)"], correct: 2, explanation: "拉 (lā) means to pull, and 拖 (tuō) means to drag."},
            {question: "What is 'attraction'?", options: ["A feeling of repulsion", "A feeling of interest or liking", "A physical barrier", "A refusal to engage"], correct: 1, explanation: "Attraction is the quality of pulling toward or appealing to (attract + -ion)."},
            {question: "Which word means 'difficult to control or manage'?", options: ["Attractive", "Contracted", "Intractable", "Protracted"], correct: 2, explanation: "Intractable means difficult to control (in- = not; tract + -able)."},
            {question: "Break down 'extraction': ex + tract + -ion means:", options: ["The act of being pulled", "The act of pulling out", "The refusal to pull", "The strong pull"], correct: 1, explanation: "Ex (out) + tract (pull) + -ion = the act of pulling out."},
            {question: "Which is NOT derived from 'tract'?", options: ["Traction", "Contract", "Extract", "Transaction"], correct: 3, explanation: "Transaction comes from trans- (across) + action, not directly from tract."}
        ];
        let currentQuestion = 0, score = 0, answered = [], shuffledQuestions = [];
        function shuffleArray(array) { let arr = [...array]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
        function initQuiz() { shuffledQuestions = shuffleArray(quizData); answered = new Array(shuffledQuestions.length).fill(null); currentQuestion = 0; score = 0; displayQuestion(); }
        function displayQuestion() { const q = shuffledQuestions[currentQuestion]; document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1}`; document.getElementById('questionText').textContent = q.question; document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${shuffledQuestions.length}`; const optionsContainer = document.getElementById('optionsContainer'); optionsContainer.innerHTML = ''; q.options.forEach((option, index) => { const label = document.createElement('label'); label.className = 'option'; label.innerHTML = `<input type="radio" name="answer" value="${index}" ${answered[currentQuestion] === index ? 'checked' : ''}>${option}`; label.onclick = () => selectAnswer(index); optionsContainer.appendChild(label); }); document.getElementById('feedback').className = 'feedback'; document.getElementById('feedback').innerHTML = ''; updateProgress(); updateButtons(); }
        function selectAnswer(index) { const q = shuffledQuestions[currentQuestion]; const isFirstAnswer = answered[currentQuestion] === null; answered[currentQuestion] = index; const options = document.querySelectorAll('.option'); options.forEach((opt, i) => { opt.classList.remove('selected', 'correct', 'incorrect'); if (i === index) opt.classList.add('selected'); }); const feedback = document.getElementById('feedback'); feedback.classList.add('show'); if (index === q.correct) { feedback.classList.add('correct'); feedback.innerHTML = `✓ Correct! ${q.explanation}`; if (isFirstAnswer) score++; options[index].classList.add('correct'); } else { feedback.classList.add('incorrect'); feedback.innerHTML = `✗ Incorrect. The correct answer is "${q.options[q.correct]}". ${q.explanation}`; options[index].classList.add('incorrect'); options[q.correct].classList.add('correct'); } updateProgress(); updateButtons(); }
        function updateProgress() { const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100; document.getElementById('progressFill').style.width = progress + '%'; document.getElementById('scoreText').textContent = `Score: ${score}/${currentQuestion + 1}`; }
        function updateButtons() { document.getElementById('prevBtn').disabled = currentQuestion === 0; document.getElementById('nextBtn').disabled = answered[currentQuestion] === null; }
        function nextQuestion() { if (currentQuestion < shuffledQuestions.length - 1) { currentQuestion++; displayQuestion(); } else showResults(); }
        function previousQuestion() { if (currentQuestion > 0) { currentQuestion--; displayQuestion(); } }
        function showResults() { document.getElementById('quizCard').style.display = 'none'; document.getElementById('nextBtn').style.display = 'none'; document.getElementById('prevBtn').style.display = 'none'; const percentage = Math.round((score / shuffledQuestions.length) * 100); document.getElementById('finalScore').textContent = `${score}/${shuffledQuestions.length}`; let message = ''; if (percentage === 100) message = '🎉 Perfect score! You\'ve mastered this root word!'; else if (percentage >= 80) message = '🌟 Excellent work! You understand this root well!'; else if (percentage >= 60) message = '👍 Good job! Keep practicing to improve!'; else message = '📚 Keep studying! Review the flashcards and try again.'; document.getElementById('resultsMessage').textContent = message + ` (${percentage}%)`; document.getElementById('results').classList.add('show'); }
        function restartQuiz() { document.getElementById('quizCard').style.display = 'block'; document.getElementById('nextBtn').style.display = 'inline-block'; document.getElementById('prevBtn').style.display = 'inline-block'; document.getElementById('results').classList.remove('show'); initQuiz(); }
        initQuiz();
    </script>
</body>
</html>
