<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Roots Flashcards - spect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001a33 0%, #003d66 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .progress-bar {
            background-color: rgba(255, 255, 255, 0.3);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4ade80;
            transition: width 0.3s ease;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .card.flipped {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .card-side {
            text-align: center;
            width: 100%;
        }

        .card-label {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card-text {
            font-size: 2em;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .card.flipped .card-text {
            font-size: 1.3em;
        }

        .hint-section {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(79, 172, 254, 0.3);
        }

        .card.show-hint .hint-section {
            display: block;
        }

        .hint-label {
            font-size: 0.8em;
            opacity: 0.6;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hint-text {
            font-size: 1em;
            font-style: italic;
            opacity: 0.85;
        }

        .flip-instruction {
            font-size: 0.9em;
            opacity: 0.5;
            margin-top: 20px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background: white;
            color: #4facfe;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #f0f0f0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .button-primary {
            background: #4ade80;
            color: white;
        }

        .button-primary:hover {
            background: #22c55e;
            color: white;
        }

        .stats {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .card-number {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
            margin-top: 10px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            font-size: 0.9em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: white;
            color: #4facfe;
        }

        .filter-btn:hover {
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Latin Roots Flashcards</h1>
            <p>Master the root: spect (look)</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterCards('all')">All Cards</button>
            <button class="filter-btn" onclick="filterCards('roots')">Root Only</button>
            <button class="filter-btn" onclick="filterCards('words')">Words Only</button>
        </div>

        <div class="card" id="card">
            <div class="card-side">
                <div class="card-label" id="cardLabel">Front</div>
                <div class="card-text" id="cardText">Click to reveal</div>
                <div class="flip-instruction">Click card to flip</div>
            </div>
            <div class="hint-section">
                <div class="hint-label">Hint:</div>
                <div class="hint-text" id="hintText"></div>
            </div>
            <div class="card-number" id="cardNumber"></div>
        </div>

        <div class="controls">
            <button onclick="previousCard()" id="prevBtn">← Previous</button>
            <button class="button-primary" onclick="showHint()">Show Hint</button>
            <button onclick="nextCard()" id="nextBtn">Next →</button>
        </div>

        <div class="stats" id="stats"></div>
    </div>

    <script>
        const flashcardsData = [
            {
                front: "Root word: spect",
                back: "To look, watch, or observe. (Chinese: 看 / 观赏 - kàn / guān shǎng)",
                hint: "Core meaning: to observe or examine carefully.",
                type: "root"
            },
            {
                front: "inspect",
                back: "To look at something closely and critically. (Chinese: 检查 / 视察 - jiǎn chá / shì chá)",
                hint: "in- (upon) + spect = to look closely at",
                type: "word"
            },
            {
                front: "respect",
                back: "To regard with admiration or honor; a specific aspect. (Chinese: 尊敬 / 方面 - zūn jìng / fāng miàn)",
                hint: "re- (back) + spect = to look back up to with admiration",
                type: "word"
            },
            {
                front: "suspect",
                back: "To believe someone is guilty without proof; a person suspected. (Chinese: 怀疑 / 嫌疑人 - huái yí / xián yí rén)",
                hint: "sub- (under) + spect = to look secretly at",
                type: "word"
            },
            {
                front: "perspective",
                back: "A particular point of view or way of looking at things. (Chinese: 视角 / 观点 - shì jiǎo / guān diǎn)",
                hint: "per- (through) + spect + -ive = the way one looks through things",
                type: "word"
            },
            {
                front: "spectator",
                back: "A person who watches an event, sport, or show. (Chinese: 观众 - guān zhòng)",
                hint: "spect + -ator (one who) = one who watches",
                type: "word"
            },
            {
                front: "aspect",
                back: "A particular part, feature, or phase of something. (Chinese: 方面 / 层面 - fāng miàn / céng miàn)",
                hint: "ad- (towards) + spect = how something looks toward you",
                type: "word"
            },
            {
                front: "inspection",
                back: "A careful examination or official review. (Chinese: 检查 / 审查 - jiǎn chá / shěn chá)",
                hint: "inspect + -ion = the act of looking closely",
                type: "word"
            },
            {
                front: "expectation",
                back: "A belief about what will happen; something hoped for. (Chinese: 期望 / 预期 - qī wàng / yù qī)",
                hint: "ex- (out) + spect + -ation = looking forward/outward",
                type: "word"
            },
            {
                front: "introspection",
                back: "Examining one's own thoughts and feelings. (Chinese: 内省 / 自我反思 - nèi xǐng / zì wǒ fǎn sī)",
                hint: "intro- (inward) + spect + -ion = looking into oneself",
                type: "word"
            },
            {
                front: "retrospective",
                back: "Looking back at the past; showing past events. (Chinese: 回顾性的、展览会 - huí gù xìng de, zhǎn lǎn huì)",
                hint: "retro- (back) + spect + -ive = looking back",
                type: "word"
            },
            {
                front: "spectacular",
                back: "Very impressive or striking; amazing to look at. (Chinese: 壮观的、令人惊艳的 - zhuàng guān de, lìng rén jīng yàn de)",
                hint: "spect + -acular = worth looking at with wonder",
                type: "word"
            }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let visibleCards = [...flashcardsData];
        let currentFilter = 'all';

        const cardElement = document.getElementById('card');
        const cardLabel = document.getElementById('cardLabel');
        const cardText = document.getElementById('cardText');
        const hintText = document.getElementById('hintText');
        const cardNumber = document.getElementById('cardNumber');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const stats = document.getElementById('stats');

        function filterCards(type) {
            currentFilter = type;
            if (type === 'roots') {
                visibleCards = flashcardsData.filter(card => card.type === 'root');
            } else if (type === 'words') {
                visibleCards = flashcardsData.filter(card => card.type === 'word');
            } else {
                visibleCards = [...flashcardsData];
            }
            currentIndex = 0;
            isFlipped = false;
            updateFilterButtons();
            displayCard();
        }

        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.filter-btn').forEach((btn, i) => {
                if ((i === 0 && currentFilter === 'all') ||
                    (i === 1 && currentFilter === 'roots') ||
                    (i === 2 && currentFilter === 'words')) {
                    btn.classList.add('active');
                }
            });
        }

        function displayCard() {
            const currentCard = flashcardsData[flashcardsData.indexOf(visibleCards[currentIndex])];

            cardLabel.textContent = isFlipped ? 'Back' : 'Front';
            cardText.textContent = isFlipped ? currentCard.back : currentCard.front;
            hintText.textContent = currentCard.hint;

            cardElement.classList.toggle('flipped', isFlipped);
            cardElement.classList.remove('show-hint');

            cardNumber.textContent = `Card ${currentIndex + 1} of ${visibleCards.length}`;

            const progress = ((currentIndex + 1) / visibleCards.length) * 100;
            progressFill.style.width = progress + '%';

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === visibleCards.length - 1;

            stats.textContent = `${currentIndex + 1} / ${visibleCards.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            displayCard();
        }

        function nextCard() {
            if (currentIndex < visibleCards.length - 1) {
                currentIndex++;
                isFlipped = false;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                isFlipped = false;
                displayCard();
            }
        }

        function showHint() {
            cardElement.classList.toggle('show-hint');
        }

        cardElement.addEventListener('click', flipCard);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === ' ') {
                e.preventDefault();
                flipCard();
            }
        });

        displayCard();
    </script>
</body>
</html>
