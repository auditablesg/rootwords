<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Roots Quiz - form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .progress-container {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 30px;
            color: white;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .progress-bar {
            background-color: rgba(255, 255, 255, 0.3);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4ade80;
            transition: width 0.3s ease;
        }

        .quiz-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 30px;
        }

        .question-number {
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 25px;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 1em;
        }

        .option:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .option input[type="radio"] {
            margin-right: 10px;
        }

        .option.selected {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .option.correct {
            border-color: #4ade80;
            background-color: #f0fdf4;
        }

        .option.incorrect {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .feedback {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background-color: #dcfce7;
            color: #166534;
            border-left: 4px solid #4ade80;
        }

        .feedback.incorrect {
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #f0f0f0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .button-primary {
            background: #4ade80;
            color: white;
        }

        .button-primary:hover {
            background: #22c55e;
            color: white;
        }

        .results {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .results.show {
            display: block;
        }

        .score-display {
            font-size: 3em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .results-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
        }

        .results-message {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Root Word Quiz</h1>
            <p>Master the root: form (shape)</p>
        </div>

        <div class="progress-container">
            <div class="progress-text">
                <span id="progressText">Question 1 of 15</span>
                <span id="scoreText">Score: 0/0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="quiz-card" id="quizCard">
            <div class="question-number" id="questionNumber">Question 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback"></div>
        </div>

        <div class="results" id="results">
            <div class="score-display" id="finalScore">15/15</div>
            <div class="results-text">Quiz Complete!</div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="button-primary" onclick="restartQuiz()">Restart Quiz</button>
        </div>

        <div class="controls">
            <button onclick="previousQuestion()" id="prevBtn">← Previous</button>
            <button class="button-primary" onclick="nextQuestion()" id="nextBtn">Next →</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What does the root 'form' mean?",
                options: ["To shape or make", "To break", "To see", "To speak"],
                correct: 0,
                explanation: "Form means to shape, make, or create something."
            },
            {
                question: "Which word means 'to create or devise a plan'?",
                options: ["Formulate", "Deform", "Perform", "Platform"],
                correct: 0,
                explanation: "Formulate means to create or devise a plan or theory (form + -ate)."
            },
            {
                question: "What does 'deform' mean?",
                options: ["To shape again", "To distort or spoil the shape", "To make uniform", "To inform"],
                correct: 1,
                explanation: "Deform means to distort or spoil the shape of something (de- = opposite)."
            },
            {
                question: "Which word combines 'in-' (in) + 'form'?",
                options: ["Uniform", "Inform", "Reform", "Malformed"],
                correct: 1,
                explanation: "Inform means to give information (in- = in; form = shape knowledge into the mind)."
            },
            {
                question: "What is 'reform'?",
                options: ["To make worse", "To improve by removing faults", "To copy a form", "To prevent change"],
                correct: 1,
                explanation: "Reform means to improve or make better (re- = again; form = form again in a better way)."
            },
            {
                question: "What does 'uniform' mean?",
                options: ["Different from others", "Having the same form or shape", "Temporary", "Informal"],
                correct: 1,
                explanation: "Uniform means identical or having the same form (uni- = one; form = shape)."
            },
            {
                question: "Which word means 'to follow accepted rules or standards'?",
                options: ["Deform", "Transform", "Conform", "Formality"],
                correct: 2,
                explanation: "Conform means to follow accepted rules (con- = together; form = make the same form)."
            },
            {
                question: "What does 'transform' mean?",
                options: ["To form carefully", "To change shape partially", "To change completely in form", "To refuse to form"],
                correct: 2,
                explanation: "Transform means to change completely in form or nature (trans- = across/beyond)."
            },
            {
                question: "Which word is the process of forming or the way something is formed?",
                options: ["Formality", "Formation", "Performer", "Platform"],
                correct: 1,
                explanation: "Formation is the process of forming or the way something is formed (form + -ation)."
            },
            {
                question: "What does 'malformed' mean?",
                options: ["Well-shaped", "Badly shaped or incorrectly developed", "Transformed", "Reformed"],
                correct: 1,
                explanation: "Malformed means badly shaped or incorrectly developed (mal- = bad)."
            },
            {
                question: "In Chinese, 'form' is primarily translated as:",
                options: ["说话 (speak)", "形状、塑造 (shape, mold)", "看 (see)", "拉 (pull)"],
                correct: 1,
                explanation: "形状 (xíng zhuàng) means shape, and 塑造 (sù zào) means to mold or form."
            },
            {
                question: "Break down the word 'transformation': trans + form + -ation means:",
                options: ["The rule of forming", "The process of changing completely in form", "The refusal to form", "The careful formation"],
                correct: 1,
                explanation: "Trans (across) + form (shape) + -ation (noun) = the process of completely changing form."
            },
            {
                question: "Which of these is NOT derived from the root 'form'?",
                options: ["Formation", "Deform", "Formality", "Perform"],
                correct: 3,
                explanation: "Perform comes from per- (through) + form, but 'perform' means to do/execute, not shape."
            },
            {
                question: "What is 'reformation'?",
                options: ["The act of forming badly", "A significant change or improvement", "The refusal to change", "A temporary form"],
                correct: 1,
                explanation: "Reformation means a significant change or improvement, especially religious reform (re- + formation)."
            },
            {
                question: "Which word means 'strict adherence to accepted rules or conventions'?",
                options: ["Formality", "Informal", "Formation", "Transform"],
                correct: 0,
                explanation: "Formality means strict adherence to conventions (form + -ity = the quality of having structure)."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = [];
        let shuffledQuestions = [];

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initQuiz() {
            shuffledQuestions = shuffleArray(quizData);
            answered = new Array(shuffledQuestions.length).fill(null);
            currentQuestion = 0;
            score = 0;
            displayQuestion();
        }

        function displayQuestion() {
            const q = shuffledQuestions[currentQuestion];
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1}`;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${shuffledQuestions.length}`;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            q.options.forEach((option, index) => {
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `
                    <input type="radio" name="answer" value="${index}" ${answered[currentQuestion] === index ? 'checked' : ''}>
                    ${option}
                `;
                label.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(label);
            });

            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').innerHTML = '';

            updateProgress();
            updateButtons();
        }

        function selectAnswer(index) {
            const q = shuffledQuestions[currentQuestion];
            answered[currentQuestion] = index;

            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected', 'correct', 'incorrect');
                if (i === index) {
                    opt.classList.add('selected');
                }
            });

            const feedback = document.getElementById('feedback');
            feedback.classList.add('show');

            if (index === q.correct) {
                feedback.classList.add('correct');
                feedback.innerHTML = `✓ Correct! ${q.explanation}`;
                if (answered[currentQuestion] !== index) {
                    score++;
                }
                options[index].classList.add('correct');
            } else {
                feedback.classList.add('incorrect');
                feedback.innerHTML = `✗ Incorrect. The correct answer is "${q.options[q.correct]}". ${q.explanation}`;
                options[index].classList.add('incorrect');
                options[q.correct].classList.add('correct');
            }

            updateProgress();
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('scoreText').textContent = `Score: ${score}/${currentQuestion + 1}`;
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').disabled = answered[currentQuestion] === null;
        }

        function nextQuestion() {
            if (currentQuestion < shuffledQuestions.length - 1) {
                currentQuestion++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizCard').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('prevBtn').style.display = 'none';

            const percentage = Math.round((score / shuffledQuestions.length) * 100);
            document.getElementById('finalScore').textContent = `${score}/${shuffledQuestions.length}`;

            let message = '';
            if (percentage === 100) {
                message = '🎉 Perfect score! You\'ve mastered this root word!';
            } else if (percentage >= 80) {
                message = '🌟 Excellent work! You understand this root well!';
            } else if (percentage >= 60) {
                message = '👍 Good job! Keep practicing to improve!';
            } else {
                message = '📚 Keep studying! Review the flashcards and try again.';
            }

            document.getElementById('resultsMessage').textContent = message + ` (${percentage}%)`;
            document.getElementById('results').classList.add('show');
        }

        function restartQuiz() {
            document.getElementById('quizCard').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('prevBtn').style.display = 'inline-block';
            document.getElementById('results').classList.remove('show');
            initQuiz();
        }

        initQuiz();
    </script>
</body>
</html>
