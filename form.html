<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Roots Flashcards - form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .progress-bar {
            background-color: rgba(255, 255, 255, 0.3);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4ade80;
            transition: width 0.3s ease;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .card.flipped {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .card-side {
            text-align: center;
            width: 100%;
        }

        .card-label {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card-text {
            font-size: 2em;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .card.flipped .card-text {
            font-size: 1.3em;
        }

        .hint-section {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(102, 126, 234, 0.3);
        }

        .card.show-hint .hint-section {
            display: block;
        }

        .hint-label {
            font-size: 0.8em;
            opacity: 0.6;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hint-text {
            font-size: 1em;
            font-style: italic;
            opacity: 0.85;
        }

        .flip-instruction {
            font-size: 0.9em;
            opacity: 0.5;
            margin-top: 20px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #f0f0f0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .button-primary {
            background: #4ade80;
            color: white;
        }

        .button-primary:hover {
            background: #22c55e;
            color: white;
        }

        .stats {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .card-number {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
            margin-top: 10px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            font-size: 0.9em;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: white;
            color: #667eea;
        }

        .filter-btn:hover {
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Latin Roots Flashcards</h1>
            <p>Master the root: form (shape)</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterCards('all')">All Cards</button>
            <button class="filter-btn" onclick="filterCards('roots')">Root Only</button>
            <button class="filter-btn" onclick="filterCards('words')">Words Only</button>
        </div>

        <div class="card" id="card">
            <div class="card-side">
                <div class="card-label" id="cardLabel">Front</div>
                <div class="card-text" id="cardText">Click to reveal</div>
                <div class="flip-instruction">Click card to flip</div>
            </div>
            <div class="hint-section">
                <div class="hint-label">Hint:</div>
                <div class="hint-text" id="hintText"></div>
            </div>
            <div class="card-number" id="cardNumber"></div>
        </div>

        <div class="controls">
            <button onclick="previousCard()" id="prevBtn">← Previous</button>
            <button class="button-primary" onclick="showHint()">Show Hint</button>
            <button onclick="nextCard()" id="nextBtn">Next →</button>
        </div>

        <div class="stats" id="stats"></div>
    </div>

    <script>
        const flashcardsData = [
            {
                front: "Root word: form",
                back: "To shape, make, or create. (Chinese: 形状、塑造 - xíng zhuàng, sù zào)",
                hint: "Core meaning: shape or mold into a particular form.",
                type: "root"
            },
            {
                front: "formulate",
                back: "To create or devise a plan or theory. (Chinese: 制定、拟定 - zhì dìng, nǐ dìng)",
                hint: "form + -ate (verb suffix) = to give form to an idea",
                type: "word"
            },
            {
                front: "deform",
                back: "To distort or spoil the shape of something. (Chinese: 使变形、损坏 - shǐ biàn xíng, sǔn huài)",
                hint: "de- (opposite) + form = to take away normal form",
                type: "word"
            },
            {
                front: "inform",
                back: "To give information to someone. (Chinese: 通知、告知 - tōng zhī, gào zhī)",
                hint: "in- (in) + form = to put knowledge into someone's mind",
                type: "word"
            },
            {
                front: "reform",
                back: "To improve or make better by removing faults. (Chinese: 改革、改善 - gǎi gé, gǎi shàn)",
                hint: "re- (again) + form = to form again in a better way",
                type: "word"
            },
            {
                front: "uniform",
                back: "Having the same form or shape; identical. (Chinese: 制服、统一 - zhì fu, tǒng yī)",
                hint: "uni- (one) + form = same shape or form",
                type: "word"
            },
            {
                front: "conform",
                back: "To follow accepted rules or standards. (Chinese: 遵守、适应 - zūn shǒu, shì yìng)",
                hint: "con- (together) + form = to make the same form as others",
                type: "word"
            },
            {
                front: "transform",
                back: "To change completely in form or nature. (Chinese: 改变、转变 - gǎi biàn, zhuǎn biàn)",
                hint: "trans- (across/beyond) + form = to change form completely",
                type: "word"
            },
            {
                front: "formation",
                back: "The process of forming or the way something is formed. (Chinese: 形成、组成 - xíng chéng, zǔ chéng)",
                hint: "form + -ation (noun suffix) = the act or result of forming",
                type: "word"
            },
            {
                front: "malformed",
                back: "Badly shaped or incorrectly developed. (Chinese: 畸形的、形状不正常 - jī xíng de, xíng zhuàng bù zhèng cháng)",
                hint: "mal- (bad) + formed = badly formed or shaped",
                type: "word"
            },
            {
                front: "formality",
                back: "Strict adherence to accepted rules or conventions. (Chinese: 正式、拘谨 - zhèng shì, jū jǐn)",
                hint: "form + -ity (noun suffix) = the quality of having form/structure",
                type: "word"
            },
            {
                front: "reformation",
                back: "A significant change or improvement in something. (Chinese: 宗教改革、改造 - zōng jiào gǎi gé, gǎi zào)",
                hint: "re- (again) + formation = the act of forming again",
                type: "word"
            }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let visibleCards = [...flashcardsData];
        let currentFilter = 'all';

        const cardElement = document.getElementById('card');
        const cardLabel = document.getElementById('cardLabel');
        const cardText = document.getElementById('cardText');
        const hintText = document.getElementById('hintText');
        const cardNumber = document.getElementById('cardNumber');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const stats = document.getElementById('stats');

        function filterCards(type) {
            currentFilter = type;
            if (type === 'roots') {
                visibleCards = flashcardsData.filter(card => card.type === 'root');
            } else if (type === 'words') {
                visibleCards = flashcardsData.filter(card => card.type === 'word');
            } else {
                visibleCards = [...flashcardsData];
            }
            currentIndex = 0;
            isFlipped = false;
            updateFilterButtons();
            displayCard();
        }

        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.filter-btn').forEach((btn, i) => {
                if ((i === 0 && currentFilter === 'all') ||
                    (i === 1 && currentFilter === 'roots') ||
                    (i === 2 && currentFilter === 'words')) {
                    btn.classList.add('active');
                }
            });
        }

        function displayCard() {
            const currentCard = flashcardsData[flashcardsData.indexOf(visibleCards[currentIndex])];

            cardLabel.textContent = isFlipped ? 'Back' : 'Front';
            cardText.textContent = isFlipped ? currentCard.back : currentCard.front;
            hintText.textContent = currentCard.hint;

            cardElement.classList.toggle('flipped', isFlipped);
            cardElement.classList.remove('show-hint');

            cardNumber.textContent = `Card ${currentIndex + 1} of ${visibleCards.length}`;

            const progress = ((currentIndex + 1) / visibleCards.length) * 100;
            progressFill.style.width = progress + '%';

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === visibleCards.length - 1;

            stats.textContent = `${currentIndex + 1} / ${visibleCards.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            displayCard();
        }

        function nextCard() {
            if (currentIndex < visibleCards.length - 1) {
                currentIndex++;
                isFlipped = false;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                isFlipped = false;
                displayCard();
            }
        }

        function showHint() {
            cardElement.classList.toggle('show-hint');
        }

        cardElement.addEventListener('click', flipCard);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === ' ') {
                e.preventDefault();
                flipCard();
            }
        });

        displayCard();
    </script>
</body>
</html>
